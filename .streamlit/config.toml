[theme]
base = "light"
primaryColor = "#ef6243"
backgroundColor = "#f6f8f9"
secondaryBackgroundColor = "#eef1f3"
textColor = "#26343c"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap"
baseRadius = "small"
buttonRadius = "small"
showWidgetBorder = true
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#edf1f3"
dataframeBorderColor = "#d8e1e5"
chartCategoricalColors = ["#4f7896", "#e69235", "#d94f47", "#218268", "#8c72a8", "#d7784d"]

[theme.sidebar]
backgroundColor = "#f1f6f8"
secondaryBackgroundColor = "#e6edf1"
textColor = "#26343c"
primaryColor = "#ef6243"